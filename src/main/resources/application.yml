spring:
  application:
    name: resource-autoscaler
  profiles:
    active: mock

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  peak-hours:
    start: "07:00"
    end: "18:00"
    days-of-week: "1,2,3,4,5"
    peak-target-utilization: 65.0
    off-peak-target-utilization: 10.0
    scaling-cooldown-minutes: 15
  cost-analysis:
    currency: USD
    analysis-period-days: 30

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.resourceautoscaler: DEBUG
    org.springframework.web: INFO
